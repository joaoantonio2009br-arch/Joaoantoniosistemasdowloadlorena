<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>João Antônio Sistemas — Instalador</title>
<link rel="icon" href="logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --fg:#fff;
    --muted:#8a8a8a;
    --font:'Orbitron','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* brilho suave ao fundo */
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(60% 45% at 50% 38%, rgba(255,255,255,.10), transparent 70%),
      radial-gradient(40% 30% at 50% 100%, rgba(255,255,255,.05), transparent 70%);
    pointer-events:none;
  }
  /* grade sutil */
  body::after{
    content:"";
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(70% 60% at 50% 45%, #000, transparent 80%);
            mask-image:radial-gradient(70% 60% at 50% 45%, #000, transparent 80%);
    pointer-events:none;
  }

  main{
    position:relative;z-index:1;
    width:100%;
    max-width:560px;
    padding:24px;
    display:flex;flex-direction:column;align-items:center;
    gap:44px;
  }

  .logo{
    width:100%;
    max-width:460px;
    height:auto;
    mix-blend-mode:screen; /* funde o preto da imagem com o fundo */
    opacity:0;
    transform:translateY(14px) scale(.98);
    animation:enter .9s cubic-bezier(.2,.7,.2,1) .1s forwards;
    user-select:none;
    -webkit-user-drag:none;
  }

  .btn{
    position:relative;
    overflow:hidden;
    display:inline-flex;align-items:center;justify-content:center;gap:14px;
    min-width:260px;
    padding:18px 40px;
    font-family:var(--font);
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:#000;
    background:var(--fg);
    border:none;
    border-radius:4px;
    cursor:pointer;
    clip-path:polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); /* corte inclinado, como a logo */
    opacity:0;
    transform:translateY(14px);
    animation:enter .9s cubic-bezier(.2,.7,.2,1) .35s forwards;
    transition:transform .25s ease, background .25s ease, color .25s ease;
  }
  .btn:hover{transform:translateY(-3px)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:6px}

  .btn svg{width:20px;height:20px;flex:none;transition:transform .25s ease}
  .btn:hover svg{transform:translateY(3px)}

  /* barra de progresso dentro do botão */
  .btn .bar{
    position:absolute;left:0;bottom:0;height:100%;width:0;
    background:#000;
    z-index:0;
    transition:width 1.4s cubic-bezier(.3,.7,.2,1);
  }
  .btn .label,.btn svg{position:relative;z-index:1;mix-blend-mode:difference;color:#fff}
  .btn .label,.btn svg{color:#fff}
  .btn.loading{pointer-events:none}
  .btn.loading .bar{width:100%}

  .btn.done{background:#fff}

  footer{
    position:fixed;bottom:18px;left:0;right:0;
    text-align:center;
    font-size:.65rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:var(--muted);
    opacity:0;
    animation:enter 1s ease .8s forwards;
  }

  @keyframes enter{to{opacity:1;transform:none}}

  @media (max-width:480px){
    main{gap:34px}
    .btn{min-width:230px;padding:16px 30px;font-size:.95rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}
  }
</style>
</head>
<body>

<main>
  <img class="logo" src="logo.jpeg" alt="João Antônio Sistemas" draggable="false">

  <button class="btn" id="instalar" type="button">
    <span class="bar"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/>
    </svg>
    <span class="label" id="label">Instalar</span>
  </button>
</main>

<footer>João Antônio Sistemas</footer>

<script>
  // ====== CONFIGURAÇÃO ======
  // Nome do .zip que fica na MESMA pasta do index.html no GitHub.
  const ARQUIVO_ZIP = "sistema.zip";
  // ==========================

  const btn   = document.getElementById("instalar");
  const label = document.getElementById("label");

  btn.addEventListener("click", () => {
    if (btn.classList.contains("loading")) return;

    btn.classList.add("loading");
    label.textContent = "Baixando";

    // deixa a animação rodar e então dispara o download
    setTimeout(() => {
      const a = document.createElement("a");
      a.href = ARQUIVO_ZIP;
      a.download = ARQUIVO_ZIP;
      document.body.appendChild(a);
      a.click();
      a.remove();

      label.textContent = "Concluído";
      btn.classList.add("done");

      // volta ao estado inicial
      setTimeout(() => {
        btn.classList.remove("loading","done");
        label.textContent = "Instalar";
      }, 2200);
    }, 1500);
  });
</script>
</body>
</html>
